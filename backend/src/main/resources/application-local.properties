# Local development profile: activate with  -Dspring-boot.run.profiles=local
# Enables the H2 web console at http://localhost:8080/h2-console (localhost only).
# Never enable this profile on a public deployment.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
