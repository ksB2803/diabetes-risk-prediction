# ---------------------------------------------------------------------------
# Diabetes Risk Prediction - Spring Boot backend
# Every value can be overridden with an environment variable (see .env.example).
# ---------------------------------------------------------------------------
spring.application.name=diabetes-risk-prediction
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---- Local storage (uploaded CSVs + H2 database files) ----
app.storage.dir=${APP_STORAGE_DIR:./storage}
# Keep uploaded CSVs after training (true) or delete them once the job finishes (false).
app.storage.keep-uploads=${APP_KEEP_UPLOADS:true}

# ---- H2 database ----
# File-based (default): data survives restarts. Files live in ${app.storage.dir}/db/.
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:${app.storage.dir}/db/diabetes-risk;DB_CLOSE_ON_EXIT=FALSE}
# In-memory alternative (data lost on restart):
#   APP_DB_URL=jdbc:h2:mem:diabetes-risk;DB_CLOSE_DELAY=-1
spring.datasource.username=${APP_DB_USER:sa}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 web console is OFF by default. The "local" profile turns it on for localhost only.
spring.h2.console.enabled=false

# ---- Uploads ----
spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_SIZE:20MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:21MB}
# Let Tomcat read (and discard) oversized bodies so the browser receives the 413 JSON error.
server.tomcat.max-swallow-size=${APP_MAX_SWALLOW_SIZE:64MB}

# ---- Internal Python ML service ----
app.ml.base-url=${ML_SERVICE_URL:http://127.0.0.1:8000}
app.ml.api-key=${ML_INTERNAL_API_KEY:}
app.ml.connect-timeout=${ML_CONNECT_TIMEOUT:3s}
app.ml.request-timeout=${ML_REQUEST_TIMEOUT:30s}
app.ml.training-timeout=${ML_TRAINING_TIMEOUT:10m}

# ---- Training job worker (bounded) ----
app.training.max-concurrent-jobs=${APP_MAX_CONCURRENT_JOBS:1}
app.training.queue-capacity=${APP_JOB_QUEUE_CAPACITY:10}

# ---- CORS (empty = same-origin only; the frontend is served by this app) ----
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

logging.level.org.hibernate.SQL=WARN
